name: Swift

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Portable core tests
    # The Swift image pins the toolchain; the runner image must be one that
    # Docker Hub's swift tag is built for.
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test
